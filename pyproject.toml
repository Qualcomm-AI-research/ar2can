[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modernise syntax)
    "ANN", # flake8-annotations (missing type hints)
    "D",   # pydocstyle (docstring conventions)
]
ignore = [
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__ (covered by class docstring)
    "D205",   # blank line between summary and description — all our
              # violations are single-sentence docstrings wrapped at 79 chars
    "ANN401", # use of Any is intentional in load_models return type
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]
exclude = [
    "pipeline/artist_pipeline_multicond.py",  # third-party-derived
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["pipeline/artist_pipeline_multicond\\.py"]
